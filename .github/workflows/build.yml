name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache
          pip install --upgrade pip
          pip install buildozer cython

      - name: Force Install Android Command Line Tools (Fixes sdkmanager error)
        run: |
          ANDROID_SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$ANDROID_SDK_DIR/cmdline-tools"
          
          # Download official command line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          
          # Move to the exact expected path structure
          rm -rf "$ANDROID_SDK_DIR/cmdline-tools/latest"
          mv cmdline-tools "$ANDROID_SDK_DIR/cmdline-tools/latest"
          rm -f cmdline-tools.zip

          # Symlink tools/bin to cmdline-tools/latest/bin so buildozer finds it instantly
          mkdir -p "$ANDROID_SDK_DIR/tools"
          ln -s "$ANDROID_SDK_DIR/cmdline-tools/latest/bin" "$ANDROID_SDK_DIR/tools/bin"
          
          # Pre-accept licenses
          yes | "$ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build APK with Buildozer
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSES: '1'
          BUILDOZER_ALLOW_KIVY_BUILD_AS_ROOT: '1'
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-dashboard-apk
          path: bin/*.apk
