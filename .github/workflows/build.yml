name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache
          pip install --upgrade pip
          pip install buildozer cython

      - name: Setup Android SDK Environment
        run: |
          # Use GitHub's pre-installed Android SDK and accept licenses globally
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          
          # Accept all Android SDK licenses beforehand
          mkdir -p /usr/local/lib/android/sdk/licenses
          echo -e "\n24333702350630826d1900113a723a3107ed6d00\n89330d322059213157217db101470b5da9772578\n7d2452d841303a919345864f45041d7148208954" > /usr/local/lib/android/sdk/licenses/android-sdk-license

      - name: Build APK with Buildozer
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          APP_ANDROID_ACCEPT_SDK_LICENSES: '1'
          BUILDOZER_ALLOW_KIVY_BUILD_AS_ROOT: '1'
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-dashboard-apk
          path: bin/*.apk
