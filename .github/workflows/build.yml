name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies & Android SDK Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            android-sdk build-essential ccache
          pip install --upgrade pip
          pip install buildozer cython

      - name: Pre-accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses || true
          echo -e "\n24333702350630826d1900113a723a3107ed6d00\n89330d322059213157217db101470b5da9772578\n7d2452d841303a919345864f45041d7148208954" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license || true

      - name: Build APK with Buildozer
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSES: '1'
          BUILDOZER_ALLOW_KIVY_BUILD_AS_ROOT: '1'
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-dashboard-apk
          path: bin/*.apk
