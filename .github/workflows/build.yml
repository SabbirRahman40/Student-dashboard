name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache
          pip install --upgrade pip
          pip install buildozer cython

      - name: Setup Android SDK, AIDL & Build-Tools
        run: |
          # Buildozer local SDK directory structure setup
          BUILDOZER_SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BUILDOZER_SDK_DIR"

          # Symlink pre-installed SDK folders from GitHub runner to Buildozer's folder
          ln -s /usr/local/lib/android/sdk/build-tools "$BUILDOZER_SDK_DIR/build-tools"
          ln -s /usr/local/lib/android/sdk/platforms "$BUILDOZER_SDK_DIR/platforms"
          ln -s /usr/local/lib/android/sdk/platform-tools "$BUILDOZER_SDK_DIR/platform-tools"
          
          # Accept licenses
          mkdir -p "$BUILDOZER_SDK_DIR/licenses"
          echo -e "\n24333702350630826d1900113a723a3107ed6d00\n89330d322059213157217db101470b5da9772578\n7d2452d841303a919345864f45041d7148208954" > "$BUILDOZER_SDK_DIR/licenses/android-sdk-license"

      - name: Build APK with Buildozer
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSES: '1'
          BUILDOZER_ALLOW_KIVY_BUILD_AS_ROOT: '1'
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-dashboard-apk
          path: bin/*.apk
