name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache openjdk-17-jdk
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK with Buildozer (Auto SDK Setup)
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          APP_ANDROID_ACCEPT_SDK_LICENSES: '1'
          BUILDOZER_ALLOW_KIVY_BUILD_AS_ROOT: '1'
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-dashboard-apk
          path: bin/*.apk
